name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PROXY_IMAGE: node:24.13.1-bookworm-slim@sha256:a81a03dd965b4052269a57fac857004022b522a4bf06e7a739e25e18bce45af2
  # Most jobs need only the coordinator; Python is enabled in the primary check.
  MISE_ENABLE_TOOLS: node

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-node
      - name: Select changed harnesses and Docker checks
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE_PUSH: ${{ github.event.forced }}
        run: node .github/scripts/harness-ci.mjs plan

  # Infrastructure checks: no API keys or model calls.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [default, node22]
    env:
      MISE_ENABLE_TOOLS: ${{ matrix.runtime == 'default' && 'node,python' || 'node' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the minimum supported Node version
        if: matrix.runtime == 'node22'
        run: echo 'MISE_NODE_VERSION=22.0.0' >> "$GITHUB_ENV"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-${{ matrix.runtime }}
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Unit and integration tests
        run: mise run test 2>&1 | tee "$RUNNER_TEMP/ci-logs/node-tests.log"
      - name: Offline Python regressions
        if: ${{ !cancelled() && matrix.runtime == 'default' }}
        run: mise run test:python 2>&1 | tee "$RUNNER_TEMP/ci-logs/python-tests.log"
      - name: Records, ledger, pins and contracts
        if: ${{ !cancelled() }}
        run: mise run check 2>&1 | tee "$RUNNER_TEMP/ci-logs/check.log"
      - name: Preserve check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
          if-no-files-found: warn

  # PRs test the real boundary before merging changes to its implementation.
  docker:
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-node
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Pull the immutable proxy image
        run: docker pull "$PROXY_IMAGE" 2>&1 | tee "$RUNNER_TEMP/ci-logs/pull.log"
      - name: Docker boundary smoke
        run: mise run test:docker 2>&1 | tee "$RUNNER_TEMP/ci-logs/docker-tests.log"
      - name: Preserve Docker logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-boundary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
          if-no-files-found: warn

  # Harbor experiment tests import pinned Harbor, so they run apart from `check`.
  # They share the Docker job's condition: documentation-only PRs skip both.
  harbor:
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node,python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-default
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Install pinned Harbor
        run: node scripts/test-harbor.mjs --setup 2>&1 | tee "$RUNNER_TEMP/ci-logs/harbor-setup.log"
      - name: Harbor experiment tests
        run: node scripts/test-harbor.mjs 2>&1 | tee "$RUNNER_TEMP/ci-logs/harbor-tests.log"
      - name: Preserve Harbor logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harbor-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
          if-no-files-found: warn

  # PR/push: affected harnesses; manual/weekly: every profile.
  images:
    needs: plan
    if: needs.plan.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HARNESS: ${{ matrix.harness }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-node
      - name: Prepare logs
        run: mkdir -p "$RUNNER_TEMP/ci-logs"
      - name: Build pinned harness
        run: node .github/scripts/harness-ci.mjs build "$HARNESS" 2>&1 | tee "$RUNNER_TEMP/ci-logs/build.log"
      - name: Verify installed version without network
        run: node .github/scripts/harness-ci.mjs smoke "$HARNESS" 2>&1 | tee "$RUNNER_TEMP/ci-logs/version.log"
      - name: Pull proxy for local bridge
        if: matrix.harness == 'pi'
        run: docker pull "$PROXY_IMAGE" 2>&1 | tee "$RUNNER_TEMP/ci-logs/pull.log"
      - name: Pi SDK and local bridge Docker smoke
        if: matrix.harness == 'pi'
        run: mise run test:local-docker 2>&1 | tee "$RUNNER_TEMP/ci-logs/local-docker-tests.log"
      - name: Preserve image and smoke logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.harness }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
          if-no-files-found: warn

  compare:
    needs: [plan, check, docker, images]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.plan.result == 'success' && needs.check.result == 'success' &&
          needs.docker.result == 'success' &&
          (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: '2026.11.3'
          cache_key_prefix: mise-node
      - name: Generate comparison and job summary
        run: |
          mise run compare -- --out results/compare/latest.md
          cat results/compare/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish comparison artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-${{ github.sha }}-${{ github.run_attempt }}
          path: results/compare/latest.md
          retention-days: 90
          if-no-files-found: error
