# Coordinator and offline-check environment; harness versions stay in harness.json.
[tools]
node = "24.13.1"
python = "3.12.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"

[tasks.test]
description = "Unit and integration tests without model APIs"
run = "npm test --"

[tasks."test:python"]
description = "Offline Python regressions"
run = "npm run test:python"

[tasks.check]
description = "Run records, ledger, version pins and contracts"
run = "npm run check"

[tasks.verify]
description = "All checks without Docker or model APIs"
run = ["npm test", "npm run test:python", "npm run check"]

[tasks."test:docker"]
description = "Docker boundary smoke with a synthetic workload"
run = "npm run test:docker"

[tasks."test:local-docker"]
description = "Docker smoke for the Pi SDK and local bridge"
run = "npm run test:local-docker"

[tasks.compare]
description = "Comparison report for recorded runs"
run = "npm run compare --"
